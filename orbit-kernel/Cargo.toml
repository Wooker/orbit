[package]
name = "orbit-kernel"
version = "0.1.2"
edition = "2024"
description = "Orbit kernel"
license = "MIT"

[dependencies]
embedded-hal = "1.0.0"
orbit-arch = { version = "0.0.2", optional = true }
orbit-chip = { version = "0.0.1", optional = true }
orbit-common = "0.0.1"
orbit-common-proc-macro = "0.0.2"
spaceport = "0.1.0"
embedded-alloc = { version = "0.7.0", optional = true }

[features]
rt = ["orbit-arch", "orbit-chip/rt", "embedded-alloc", "alloc_llff"]
alloc_llff = []
alloc_tlsf = []
lib  = []
pfic = []

qemu = [ "rt", "orbit-arch/riscv", "orbit-chip/qemu" ]
ch32v208wbu6 = [ "rt", "orbit-arch/qingke_v4", "orbit-chip/ch32v208wbu6" ]
ch32x035 = [ "rt", "orbit-arch/qingke_v4", "orbit-chip/ch32x035" ]
ch592 = [ "rt", "orbit-arch/qingke_v4", "orbit-chip/ch592" ]
esp32c3 = [ "rt", "orbit-arch/esp_riscv", "orbit-chip/esp32c3" ]
ch32v003 = [ "rt", "orbit-arch/qingke_v2", "orbit-chip/ch32v003" ]
bl702 = [ "rt", "orbit-arch/riscv", "orbit-chip/bl702" ]
