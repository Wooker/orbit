[package]
name = "orbit-bin"
version = "0.1.0"
edition = "2024"

[dependencies]
orbit-kernel = { path = "../orbit-kernel", features = [ "rt" ] }
orbit-common = { path = "../orbit-common" }
orbit-common-proc-macro = { path = "../orbit-common-proc-macro" }

[features]
ch32v208wbu6 = [ "orbit-kernel/ch32v208wbu6" ]
ch32x035 = [ "orbit-kernel/ch32x035" ]
alloc_llff = [ "orbit-kernel/alloc_llff" ]
alloc_tlsf = [ "orbit-kernel/alloc_tlsf" ]

