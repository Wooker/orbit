[package]
name = "orbit-bin"
version = "0.1.0"
edition = "2024"

[dependencies]
orbit-kernel = { path = "../orbit-kernel" }
orbit-app = { path = "../orbit-app" }
orbit-common = { path = "../orbit-common" }
orbit-common-proc-macro = { path = "../orbit-common-proc-macro" }

[build-dependencies]
regex = "1.11.1"

[features]
ch592 = [ "orbit-kernel/ch592", "orbit-app/ch592" ]
ch32v208wbu6 = [ "orbit-kernel/ch32v208wbu6", "orbit-app/ch32v208wbu6" ]
ch32x035 = [ "orbit-kernel/ch32x035", "orbit-app/ch32x035" ]
ch32v003 = [ "orbit-kernel/ch32v003", "orbit-app/ch32v003" ]
bl702 = [ "orbit-kernel/bl702", "orbit-app/bl702" ]

[[bin]]
name = "ch592f"
required-features = [ "ch592" ]

[[bin]]
name = "ch32x035"
required-features = [ "ch32x035" ]

[[bin]]
name = "ch32v208wbu6"
required-features = [ "ch32v208wbu6" ]

[[bin]]
name = "ch32v003"
required-features = [ "ch32v003" ]

[[bin]]
name = "bl702"
required-features = [ "bl702" ]
